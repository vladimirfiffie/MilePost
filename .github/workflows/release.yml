name: Release

# Three ways to cut a release, all ending in the same place:
#
#   1. Bump `version:` in pubspec.yaml and push to main. If no release exists
#      for that version yet, one is published. This is the usual route — it
#      needs no tag push, so it works without git credentials.
#   2. Push a tag: git tag v1.0.0 && git push origin v1.0.0
#   3. Run this workflow manually from the Actions tab and fill in "tag".
#
# A hyphen in the version marks it a prerelease: v1.0.0-beta.1 yes, v1.0.0 no.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version label for a manual build (e.g. v1.0.0-beta.1)'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  # Cheap gate, so an ordinary commit to main doesn't spend time building
  # an APK for a version that has already shipped.
  decide:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and decide
        id: resolve
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            workflow_dispatch) TAG="${{ inputs.tag }}" ;;
            *)
              if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
                TAG="${GITHUB_REF_NAME}"
              else
                VERSION=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
                if [ -z "$VERSION" ]; then
                  echo "::error::could not read version from pubspec.yaml"
                  exit 1
                fi
                TAG="v${VERSION}"
              fi
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Only hyphenated tags (v0.4.0-beta.1) are prereleases. A plain
          # vX.Y.Z is a full release, so GitHub gives it the "Latest" badge —
          # marking everything prerelease leaves /releases/latest a 404 and
          # the releases page looking like a bare list of tags.
          case "$TAG" in
            *-) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)  echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          # A branch push only releases a version that hasn't shipped. Without
          # this, every commit to main would try to republish the same tag.
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE:-branch}" = "branch" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is already released — bump version in pubspec.yaml to cut a new one."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing ${TAG}"
          fi

  android:
    name: Build & publish Android
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # Debug-signed: this is a test build, not a Play Store artifact.
      # Installing it requires "install from unknown sources".
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename artifacts
        env:
          V: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/milepost-${V}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -f "$src" || { echo "::error::missing $src"; exit 1; }
            cp "$src" "dist/milepost-${V}-${abi}.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: milepost-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Generate release notes
        run: |
          dart run tool/generate_release_notes.dart \
            "${{ needs.decide.outputs.tag }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # No `if:` here any more: the decide job already settled whether this
      # version should ship, and a branch push has to publish too or
      # releasing from main doesn't happen at all.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.decide.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ needs.decide.outputs.prerelease == 'false' }}
          name: MilePost ${{ needs.decide.outputs.tag }}
          files: dist/*.apk
          body_path: RELEASE_NOTES.md
